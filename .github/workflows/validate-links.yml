name: Validate Tool Links

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  validate-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          # 403/429 are bot-blocking and rate limiting, not dead links
          args: --no-progress --max-retries 3 --accept '200..=299,403,429' './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
