<svg xmlns="http://www.w3.org/2000/svg" class="nf404" viewBox="0 0 480 214" width="480" height="214" role="img" aria-labelledby="nf404-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="nf404-title">A bookshelf with one book missing; its index card, marked 404, is falling off the shelf</title>
  <style>
    .nf404{--nf-bg:#FBFAF7;--nf-surface:#FFFFFF;--nf-surface-2:#F3F1EB;--nf-border-strong:#8C8578;--nf-text:#1A1814;--nf-text-3:#6B655B;--nf-accent:#D97757;--nf-accent-ink:#A84B2C;--nf-accent-soft:#F8E7DF;overflow:visible}
    @media (prefers-color-scheme:dark){.nf404{--nf-bg:#131210;--nf-surface:#1B1A17;--nf-surface-2:#24221E;--nf-border-strong:#77705F;--nf-text:#F3F0E9;--nf-text-3:#A39D91;--nf-accent:#E0866A;--nf-accent-ink:#F09A7D;--nf-accent-soft:#3A2620}}
    .nf404 .ln{fill:none;stroke:var(--border-strong,var(--nf-border-strong));stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
    .nf404 .s1{fill:var(--surface,var(--nf-surface))}
    .nf404 .s2{fill:var(--surface-2,var(--nf-surface-2))}
    .nf404 .sa{fill:var(--accent-soft,var(--nf-accent-soft))}
    .nf404 .gap{fill:none;stroke:var(--accent,var(--nf-accent));stroke-width:1.5;stroke-dasharray:5 5}
    .nf404 .acc{stroke:var(--accent,var(--nf-accent));stroke-width:1.5}
    .nf404 .ink{fill:var(--accent-ink,var(--nf-accent-ink));font-family:'Instrument Serif',Georgia,'Times New Roman',serif}
    .nf404 .mono{fill:var(--text-3,var(--nf-text-3));font:500 7px 'Geist Mono',ui-monospace,monospace;letter-spacing:.08em}
    .nf404 .fall{fill:none;stroke:var(--text-3,var(--nf-text-3));stroke-width:1.5;stroke-linecap:round;stroke-dasharray:2 6}
    .nf404 .shadow{fill:var(--text,var(--nf-text));opacity:.12}
    .nf404 .hole{fill:var(--bg,var(--nf-bg))}
  </style>

  <!-- books -->
  <rect class="ln s2" x="40" y="52" width="26" height="128" rx="2"/>
  <path class="ln" d="M40 66h26 M40 166h26"/>
  <rect class="ln sa" x="68" y="34" width="20" height="146" rx="2"/>
  <path class="ln" d="M72 52h12 M72 58h12"/>
  <rect class="ln s1" x="90" y="62" width="32" height="118" rx="2"/>
  <path class="ln" d="M90 74h32 M90 168h32 M100 110h12"/>
  <rect class="ln s2" x="124" y="42" width="24" height="138" rx="2"/>
  <circle class="ln" cx="136" cy="62" r="4"/>

  <!-- missing book -->
  <rect class="gap" x="152" y="44" width="28" height="136" rx="2"/>
  <text class="ink" x="166" y="118" text-anchor="middle" font-size="26">?</text>

  <!-- leaning book -->
  <g transform="rotate(-13 182 180)">
    <rect class="ln s1" x="182" y="48" width="24" height="132" rx="2"/>
    <path class="ln" d="M182 62h24 M182 166h24"/>
  </g>

  <rect class="ln s2" x="212" y="56" width="28" height="124" rx="2"/>
  <path class="ln" d="M212 70h28 M220 120h12"/>
  <rect class="ln sa" x="242" y="30" width="22" height="150" rx="2"/>
  <path class="ln" d="M242 44h22 M242 166h22"/>
  <rect class="ln s1" x="266" y="68" width="30" height="112" rx="2"/>
  <path class="ln" d="M276 90h10 M276 96h10"/>
  <rect class="ln s2" x="298" y="40" width="24" height="140" rx="2"/>
  <path class="ln" d="M298 54h24 M298 166h24"/>
  <rect class="ln s1" x="324" y="60" width="34" height="120" rx="2"/>
  <circle class="ln" cx="341" cy="80" r="5"/>
  <path class="ln s2" d="M358 180l14-112h-6l-14 112z"/>

  <!-- shelf -->
  <path class="ln s2" d="M16 180h448v10H16z"/>
  <path class="ln" d="M44 190l10 18 M436 190l-10 18"/>

  <!-- falling index card -->
  <ellipse class="shadow" cx="418" cy="178" rx="30" ry="3"/>
  <path class="fall" d="M392 30c4 10 6 20 6 34 M424 22c2 12 2 24 0 38 M452 36c-2 10-4 18-8 28"/>
  <g transform="rotate(11 420 112)">
    <rect class="ln s1" x="372" y="78" width="96" height="66" rx="4"/>
    <path class="acc" d="M372 92h96"/>
    <text class="mono" x="380" y="88">CALL NO.</text>
    <text class="ink" x="382" y="124" font-size="34">404</text>
    <path class="ln" d="M432 106h26 M432 114h20 M432 122h24"/>
    <circle class="ln hole" cx="420" cy="138" r="3"/>
  </g>
</svg>
